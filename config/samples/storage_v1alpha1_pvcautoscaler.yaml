apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: default
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: default
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: writer
  namespace: default
spec:
  containers:
    - name: writer
      image: busybox
      command: ["sh", "-c", "sleep 120 && dd if=/dev/zero of=/data/blob bs=1M count=900 && sleep infinity"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
---
apiVersion: storage.elivlo.io/v1alpha1
kind: PVCAutoscaler
metadata:
  name: data
  namespace: default
  labels:
    app.kubernetes.io/name: operator-dev
    app.kubernetes.io/managed-by: kustomize
spec:
  pvcName: data
  increaseBy: 1Gi
  maxSize: 10Gi

