apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  annotations:
    volumeType: local
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: writer
spec:
  containers:
    - name: writer
      image: busybox
      command: ["sh", "-c", "dd if=/dev/zero of=/data/blob bs=1M count=200 && sleep infinity"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
